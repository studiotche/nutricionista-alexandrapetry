<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80">
  <defs>
    <style>
      .name { font-family: 'Newsreader', Georgia, serif; font-size: 28px; font-weight: 400; fill: #515d53; }
      .desc { font-family: 'DM Sans', Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #7a8b7c; letter-spacing: 3px; text-transform: uppercase; }
